[package]
name = "qubit-ioc-application-consumer"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
name = "ioc_application_consumer"

[dependencies]
qubit-ioc = { path = "../../../../rs-ioc", version = "0.3.0", default-features = false }
qubit-execution-services = { path = "../../..", version = "0.10" }
qubit-event-bus = "0.20"
qubit-fs-registry = { version = "0.8" }
qubit-fs-local = { version = "0.11", features = ["registry"] }
qubit-fs = { version = "0.3" }
tempfile = "3"
thiserror = "2"
tokio = { version = "^1.53", features = ["rt-multi-thread", "sync", "time"] }

[workspace]
