[package]
name = "qubit-ioc-application-consumer"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
name = "ioc_application_consumer"

[dependencies]
qubit-ioc = { path = "../../../../rs-ioc", version = "0.3.0" }
qubit-execution-services = { path = "../../..", version = "0.10" }
qubit-event-bus = { path = "../../../../rs-event-bus", version = "0.18.0" }
qubit-fs-registry = { path = "../../../../rs-fs-registry", version = "0.7" }
qubit-fs-local = { path = "../../../../rs-fs-local", version = "0.10", features = ["registry"] }
qubit-fs = { path = "../../../../rs-fs", version = "0.2" }
tempfile = "3"
tokio = { version = "^1.53", features = ["rt-multi-thread", "sync", "time"] }

[workspace]

[patch.crates-io]
qubit-fs-registry = { path = "../../../../rs-fs-registry" }
qubit-fs = { path = "../../../../rs-fs" }
