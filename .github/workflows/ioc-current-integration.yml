name: IoC current integration

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ioc-current-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: rs-execution-services
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: qubit-ltd/rs-executor
          ref: 92e7e6abf8010df4846ae2e1649d6aab535c55aa
          path: rs-executor
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: qubit-ltd/rs-rayon-executor
          ref: a73b03439f90ece66ba43a891a9f2fed9830f751
          path: rs-rayon-executor
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: qubit-ltd/rs-tokio-executor
          ref: 211218cfdc47bfb1e309d47ff9e3c93fc86abc3f
          path: rs-tokio-executor
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: qubit-ltd/rs-ioc
          ref: main
          path: rs-ioc
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: qubit-ltd/rs-event-bus
          ref: 3806b857e177c06b3e7830440c63d06033e0acf8
          path: rs-event-bus
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: qubit-ltd/rs-config
          ref: d6f72b0e0a7f10e8dbc1654d25a1050fbe295c29
          path: rs-config
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: qubit-ltd/rs-fs-registry
          ref: aa085df07b5a243ea3952277e2edfdf555c03894
          path: rs-fs-registry
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: qubit-ltd/rs-fs-local
          ref: 9048b872f4322859b215cecb09385429f64ebc55
          path: rs-fs-local
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: qubit-ltd/rs-fs
          ref: 5fbcecf70ffb3e66de5d32c21e0ea90565ea54b2
          path: rs-fs
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: qubit-ltd/rs-redact
          ref: 133954d6d24ed831f5133f2bd3d42a554f5e52ad
          path: rs-redact
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: qubit-ltd/rs-local-files
          ref: d4235f2dcfa34cf09ea1bf49ba4fe70bb4307c89
          path: rs-local-files
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: qubit-ltd/rs-fs-testkit
          ref: b9425fec4cd142826f95cede3715db57b82d8b08
          path: rs-fs-testkit
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: qubit-ltd/rs-value
          ref: 6f5ae6e2acd592dcb07d30b232b84735e1cc592d
          path: rs-value
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.94.0
      - name: Use repository-pinned lock for the current IoC consumer
        working-directory: rs-execution-services
        run: |
          mkdir -p ../rs-ioc/.cargo
          cp .infra/ci/ioc-cargo-patches.toml ../rs-ioc/.cargo/config.toml
          cp tests/fixtures/ioc_application_consumer_current/Cargo.lock ../rs-ioc/tests/fixtures/application_consumer_current/Cargo.lock
      - name: Record exact source revisions and hashes
        run: |
          git -C rs-ioc rev-parse HEAD
          git -C rs-execution-services rev-parse HEAD
          git -C rs-executor rev-parse HEAD
          git -C rs-rayon-executor rev-parse HEAD
          git -C rs-tokio-executor rev-parse HEAD
          git -C rs-event-bus rev-parse HEAD
          git -C rs-config rev-parse HEAD
          git -C rs-fs-registry rev-parse HEAD
          git -C rs-fs-local rev-parse HEAD
          git -C rs-fs rev-parse HEAD
          git -C rs-redact rev-parse HEAD
          git -C rs-local-files rev-parse HEAD
          git -C rs-fs-testkit rev-parse HEAD
          git -C rs-value rev-parse HEAD
          rustc +1.94.0 --version --verbose
          cargo +1.94.0 --version
          sha256sum "$(rustup which --toolchain 1.94.0 rustc)"
          sha256sum rs-ioc/tests/fixtures/application_consumer_current/Cargo.lock
          sha256sum rs-execution-services/tests/fixtures/ioc_application_consumer/src/*.rs
          sha256sum rs-execution-services/tests/fixtures/ioc_application_consumer/tests/*.rs
          sha256sum rs-execution-services/tests/fixtures/ioc_application_consumer/tests/internal/*.rs
      - name: Verify current consumer IoC feature isolation
        working-directory: rs-execution-services
        run: python3 ../rs-ioc/.infra/tools/check-manual-feature-isolation.py --manifest-path ../rs-ioc/tests/fixtures/application_consumer_current/Cargo.toml --package ioc-downstream-consumer-current
      - name: Check downstream consumer against this IoC revision
        working-directory: rs-ioc
        run: cargo +1.94.0 check --manifest-path tests/fixtures/application_consumer_current/Cargo.toml --locked
      - name: Test downstream consumer against this IoC revision
        working-directory: rs-ioc
        run: cargo +1.94.0 test --manifest-path tests/fixtures/application_consumer_current/Cargo.toml --locked
      - name: Run downstream consumer against this IoC revision
        working-directory: rs-ioc
        run: cargo +1.94.0 run --manifest-path tests/fixtures/application_consumer_current/Cargo.toml --locked
