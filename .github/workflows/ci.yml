name: Rust CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  pages: write
  id-token: write

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust-ci:
    permissions:
      contents: read
      pull-requests: write
      pages: write
      id-token: write
    uses: qubit-ltd/rs-infra-ci/.github/workflows/github-ci.yml@22e34b76a52b6a9c5c09ddf3fa1fa58b07c46f06

  ioc-integration:
    name: IoC application integration
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: rs-execution-services
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: rs-execution-services
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: qubit-ltd/rs-executor
          ref: 92e7e6abf8010df4846ae2e1649d6aab535c55aa
          path: rs-executor
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: qubit-ltd/rs-rayon-executor
          ref: a73b03439f90ece66ba43a891a9f2fed9830f751
          path: rs-rayon-executor
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: qubit-ltd/rs-tokio-executor
          ref: 211218cfdc47bfb1e309d47ff9e3c93fc86abc3f
          path: rs-tokio-executor
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: qubit-ltd/rs-ioc
          ref: be47c3694d59d7e162bad754e4f3bc1a1d6c9809
          path: rs-ioc
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: qubit-ltd/rs-event-bus
          ref: 3806b857e177c06b3e7830440c63d06033e0acf8
          path: rs-event-bus
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: qubit-ltd/rs-config
          ref: d6f72b0e0a7f10e8dbc1654d25a1050fbe295c29
          path: rs-config
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: qubit-ltd/rs-fs-registry
          ref: aa085df07b5a243ea3952277e2edfdf555c03894
          path: rs-fs-registry
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: qubit-ltd/rs-fs-local
          ref: 9048b872f4322859b215cecb09385429f64ebc55
          path: rs-fs-local
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: qubit-ltd/rs-fs
          ref: 5fbcecf70ffb3e66de5d32c21e0ea90565ea54b2
          path: rs-fs
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: qubit-ltd/rs-redact
          ref: 133954d6d24ed831f5133f2bd3d42a554f5e52ad
          path: rs-redact
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: qubit-ltd/rs-local-files
          ref: d4235f2dcfa34cf09ea1bf49ba4fe70bb4307c89
          path: rs-local-files
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: qubit-ltd/rs-fs-testkit
          ref: b9425fec4cd142826f95cede3715db57b82d8b08
          path: rs-fs-testkit
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: qubit-ltd/rs-value
          ref: 6f5ae6e2acd592dcb07d30b232b84735e1cc592d
          path: rs-value
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.94.0
          components: clippy
      - name: Install Clippy for IoC consumer checks
        run: rustup component add clippy --toolchain 1.94.0
      - name: Record exact IoC consumer sources
        run: |
          for repository in rs-execution-services rs-executor rs-rayon-executor rs-tokio-executor rs-ioc rs-event-bus rs-config rs-fs-registry rs-fs-local rs-fs rs-redact rs-local-files rs-fs-testkit rs-value; do
            git -C "../$repository" rev-parse HEAD
          done
          rustc +1.94.0 --version --verbose
          cargo +1.94.0 --version
          sha256sum "$(rustup which --toolchain 1.94.0 rustc)"
          sha256sum tests/fixtures/ioc_application_consumer/Cargo.lock
          sha256sum tests/fixtures/ioc_application_consumer/src/*.rs
          sha256sum tests/fixtures/ioc_application_consumer/tests/*.rs tests/fixtures/ioc_application_consumer/tests/internal/*.rs
      - name: Run pinned IoC consumer integration
        run: |
          cargo +1.94.0 check --manifest-path tests/fixtures/ioc_application_consumer/Cargo.toml --locked
          cargo +1.94.0 test --manifest-path tests/fixtures/ioc_application_consumer/Cargo.toml --locked
          cargo +1.94.0 run --manifest-path tests/fixtures/ioc_application_consumer/Cargo.toml --locked
          cargo +1.94.0 clippy --manifest-path tests/fixtures/ioc_application_consumer/Cargo.toml --all-targets --locked -- -D warnings
