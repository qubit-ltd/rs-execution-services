name: Rust CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  pages: write
  id-token: write

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust-ci:
    permissions:
      contents: read
      pull-requests: write
      pages: write
      id-token: write
    uses: qubit-ltd/rs-infra-ci/.github/workflows/github-ci.yml@5a51d1833cb6a2646b4e004c3b51d8c71c9f4401

  ioc-integration:
    name: IoC application integration
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: rs-execution-services
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: rs-execution-services
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: qubit-ltd/rs-ioc
          ref: 7c1133567242eb8192842b83cd34baf732de145d
          path: rs-ioc
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: qubit-ltd/rs-event-bus
          ref: 563552b58fe5cfa93f0f4f4295e7ca4e70911be1
          path: rs-event-bus
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: qubit-ltd/rs-fs-registry
          ref: 8e8940cc295b0e277241c397bea559214a272fb5
          path: rs-fs-registry
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: qubit-ltd/rs-fs-local
          ref: 7f0959f15355d3be97c681f588f0ab23ce8d40d1
          path: rs-fs-local
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: qubit-ltd/rs-fs
          ref: 4bc4d9e430719d56429f65224a112d640af51478
          path: rs-fs
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.94.0
          components: clippy
      - name: Install Clippy for IoC consumer checks
        run: rustup component add clippy --toolchain 1.94.0
      - name: Record exact IoC consumer sources
        run: |
          for repository in rs-execution-services rs-ioc rs-event-bus rs-fs-registry rs-fs-local rs-fs; do
            git -C "../$repository" rev-parse HEAD
          done
          rustc +1.94.0 --version --verbose
          cargo +1.94.0 --version
          sha256sum "$(rustup which --toolchain 1.94.0 rustc)"
          sha256sum tests/fixtures/ioc_application_consumer/Cargo.lock
          sha256sum tests/fixtures/ioc_application_consumer/src/*.rs
          sha256sum tests/fixtures/ioc_application_consumer/tests/*.rs tests/fixtures/ioc_application_consumer/tests/internal/*.rs
      - name: Run pinned IoC consumer integration
        run: |
          cargo +1.94.0 check --manifest-path tests/fixtures/ioc_application_consumer/Cargo.toml --locked
          cargo +1.94.0 test --manifest-path tests/fixtures/ioc_application_consumer/Cargo.toml --locked
          cargo +1.94.0 run --manifest-path tests/fixtures/ioc_application_consumer/Cargo.toml --locked
          cargo +1.94.0 clippy --manifest-path tests/fixtures/ioc_application_consumer/Cargo.toml --all-targets --locked -- -D warnings
